[project]
name = "ploso"
version = "0.1.0"
description = "Always-listening voice front end for Claude Code. Wake word: ploso."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "rapidfuzz>=3",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "livekit-wakeword",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
]

[project.optional-dependencies]
# CUDA runtime for faster-whisper on an NVIDIA GPU. See README "GPU".
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.scripts]
ploso = "ploso.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ploso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
