# livekit-wakeword training config for the wake phrase "hey ploso" (HAY PLOH-soh).
# Run from this directory. See README.md here.
model_name: ploso
# espeak-ng reads "hey ploso" as h'eI pl'oUsoU, which is the intended sound.
# "ploh so" was dropped: it is read as two stressed words.
target_phrases:
  - "hey ploso"
n_samples: 10000
n_samples_val: 2000
# Default 50 ran out of memory on a 4 GB GPU during negative clips.
tts_batch_size: 16
# Near misses the model must learn to ignore.
custom_negative_phrases:
  - "hey"
  - "hey so"
  - "hey also"
  - "hey plaza"
  - "hey close so"
  - "hey play so"
  - "hey pillow so"
  - "hey pluto"
  - "hey polo"
  - "hey paulo"
  - "hey pablo"
  - "hey bozo"
  - "hey there"
  - "hey siri"
  - "hey google"
  - "also"
  - "plaza"
  - "close so"
model:
  model_type: conv_attention
  model_size: medium   # small reached 68% recall at 0.1 false wakes per hour, medium 88%
steps: 50000
target_fp_per_hour: 0.2
data_dir: ./data
output_dir: ./output
